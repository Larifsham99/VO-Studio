[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latif-studio"
version = "0.1.0"
description = "Latif Voice AI home server: runs the voice models on your PC, controlled from your phone"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart", "vobench"]

[project.optional-dependencies]
asr = ["faster-whisper"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["latif_studio*"]
